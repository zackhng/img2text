[project]
name = "img2text"
version = "0.1.0"
description = "Small, fast models that turn document tables, charts and diagrams into Markdown"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.50",
    "accelerate>=1.0",
    "datasets>=3.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
synth = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "kaleido>=1.0",
    "numpy>=1.26",
    "pandas>=2.0,<3",
    "xlrd>=2.0.2",
]
eval = ["docling-core>=2.0", "apted>=1.0", "lxml>=5.0", "numpy>=1.26"]
export = ["onnxruntime>=1.19", "optimum>=1.23"]
dev = ["pytest>=8.0", "ruff>=0.6"]

# RTX 5060 Ti (Blackwell, sm_120) needs PyTorch wheels built for CUDA 12.8+.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/img2text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
